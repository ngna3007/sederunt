<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PROTOTYPE — Pot</title>
<style>
  :root {
    --ink: #1c1915;
    --muted: #6b645c;
    --line: #e4ddd2;
    --paper: #f6f3ee;
    --card: #fffcf8;
    --short: #9a5416;
    --short-bg: #f8ead6;
    --covered: #1f6b45;
    --covered-bg: #e5f3ea;
    --open: #5c574f;
    --open-bg: #eeeae4;
    --no: #8d3b32;
    --no-bg: #f8e8e4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Iowan Old Style", Palatino, Georgia, serif;
    color: var(--ink);
    background: var(--paper);
  }
  main { max-width: 980px; margin: 0 auto; padding: 32px 20px 80px; }
  .stamp {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--no);
  }
  h1 { font-size: 34px; font-weight: 500; margin: 8px 0 8px; }
  .question { font-size: 18px; line-height: 1.45; max-width: 62ch; margin: 0 0 28px; }
  .layout { display: grid; grid-template-columns: 340px 1fr; gap: 28px; align-items: start; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
  .phone {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 20px 18px;
  }
  .plan { font-size: 13px; color: var(--muted); font-family: ui-sans-serif, system-ui, sans-serif; }
  .status {
    display: inline-block;
    margin: 10px 0 4px;
    padding: 4px 10px;
    border-radius: 999px;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 13px;
    font-weight: 650;
  }
  .status.short { color: var(--short); background: var(--short-bg); }
  .status.covered { color: var(--covered); background: var(--covered-bg); }
  .status.open { color: var(--open); background: var(--open-bg); }
  .gap { margin: 0 0 16px; color: var(--muted); font-size: 15px; }
  table { width: 100%; border-collapse: collapse; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; }
  th { text-align: left; font-weight: 550; color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding-bottom: 8px; }
  td { padding: 10px 0; border-top: 1px solid var(--line); }
  td.paid { color: var(--covered); }
  td.unpaid { color: var(--short); }
  .agent {
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 15px;
    line-height: 1.4;
  }
  .agent b { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 4px; }
  .private {
    margin-top: 14px;
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    font-size: 14px;
  }
  .private b { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  h2 { font-size: 16px; font-weight: 600; font-family: ui-sans-serif, system-ui, sans-serif; margin: 0 0 8px; }
  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  button, .tab {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: white;
    padding: 7px 12px;
    cursor: pointer;
    color: var(--ink);
  }
  button:hover { border-color: #c8bfb2; }
  .tab.on { background: var(--ink); color: white; border-color: var(--ink); }
  .scenario { font-size: 15px; line-height: 1.45; margin: 0 0 12px; }
  .steps { display: flex; flex-wrap: wrap; gap: 8px; }
  .steps button.next { background: var(--ink); color: white; border-color: var(--ink); }
  .event { margin-top: 18px; padding: 12px 14px; background: white; border-radius: 12px; border: 1px solid var(--line); font-size: 15px; }
  .event.bad { background: var(--no-bg); border-color: #efd0cb; }
  .facts { margin-top: 18px; display: grid; gap: 8px; }
  .fact { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; color: var(--muted); }
  .fact strong { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="stamp">Prototype — throw this away. Nothing here is saved.</div>
  <h1>Pot</h1>
  <p class="question">This page is a sketch of the app. Press the buttons. The question: can the pot say Covered because someone said yes, or because the agent says so, before the money arrives?</p>

  <div class="layout">
    <div>
      <div class="phone" id="screen"></div>
      <div class="private" id="private"></div>
    </div>
    <div>
      <h2>Walk through it</h2>
      <div class="tabs" id="tabs"></div>
      <p class="scenario" id="blurb"></p>
      <div class="steps" id="steps"></div>
      <div class="event" id="event"></div>

      <h2 style="margin-top:28px">Or poke it yourself</h2>
      <div class="steps" id="free"></div>

      <div class="facts" id="facts"></div>
    </div>
  </div>
</main>
<script>
const AMOUNT = 40

function initial() {
  return {
    people: {
      maya: { name: "Maya", yes: 0, paid: 0, privateNote: "I cannot really afford this." },
      sam: { name: "Sam", yes: 0, paid: 0, privateNote: "" },
      jo: { name: "Jo", yes: 0, paid: 0, privateNote: "" },
    },
    lastEvent: "The pot is empty. Nobody has said yes, and nobody has paid.",
    refused: false,
  }
}

function sayYes(state, id) {
  const person = state.people[id]
  return {
    ...state,
    people: { ...state.people, [id]: { ...person, yes: AMOUNT } },
    refused: false,
    lastEvent: person.name + " said yes for $" + AMOUNT + ". That is saved as a yes. It is not a payment.",
  }
}

function pay(state, id) {
  const person = state.people[id]
  return {
    ...state,
    people: { ...state.people, [id]: { ...person, paid: person.paid + AMOUNT } },
    refused: false,
    lastEvent: "A transfer of $" + AMOUNT + " arrived from " + person.name + "'s address. The payment list updated. The yes list did not do this.",
  }
}

function remind(state) {
  const owed = Object.values(state.people).filter((p) => p.yes > p.paid).map((p) => p.name)
  const who = owed.length ? owed.join(" and ") : "nobody"
  return {
    ...state,
    refused: false,
    lastEvent: "The agent sent a reminder to " + who + ". The status did not change.",
  }
}

function agentMarksCovered(state) {
  return {
    ...state,
    refused: true,
    lastEvent: "The agent said the pot is covered. The status stayed as it was. The agent cannot set it.",
  }
}

function potStatus(state) {
  const people = Object.values(state.people)
  const yeses = people.filter((p) => p.yes > 0)
  if (yeses.length === 0) return { word: "Open", gap: 0 }
  const gap = yeses.reduce((sum, p) => sum + Math.max(0, p.yes - p.paid), 0)
  return gap === 0 ? { word: "Covered", gap: 0 } : { word: "Short", gap }
}

const ACTIONS = {
  mayaYes: (s) => sayYes(s, "maya"),
  samYes: (s) => sayYes(s, "sam"),
  joYes: (s) => sayYes(s, "jo"),
  mayaPays: (s) => pay(s, "maya"),
  samPays: (s) => pay(s, "sam"),
  joPays: (s) => pay(s, "jo"),
  remind,
  agentMarksCovered,
}

const FREE = [
  ["mayaYes", "Maya says yes"],
  ["samYes", "Sam says yes"],
  ["joYes", "Jo says yes"],
  ["mayaPays", "Maya's payment arrives"],
  ["samPays", "Sam's payment arrives"],
  ["joPays", "Jo's payment arrives"],
  ["remind", "Agent sends a reminder"],
  ["agentMarksCovered", "Agent tries to mark it covered"],
]

const SCENARIOS = [
  {
    id: "short",
    label: "Sam never pays",
    blurb: "Both of them say yes. Only Maya's money arrives. Watch the word at the top. Then let the agent try to paper over it.",
    steps: ["mayaYes", "samYes", "mayaPays", "agentMarksCovered", "remind"],
  },
  {
    id: "covered",
    label: "Both pay",
    blurb: "The word changes to Covered only after the second payment. Saying yes is not enough.",
    steps: ["mayaYes", "samYes", "mayaPays", "samPays"],
  },
  {
    id: "private",
    label: "Maya's private note",
    blurb: "Maya has a note on her own agent. It never shows on the group screen, even after she says yes.",
    steps: ["mayaYes", "mayaPays"],
  },
]

let state = initial()
let scenario = SCENARIOS[0]
let step = 0

function dispatch(name) {
  state = ACTIONS[name](state)
  render()
}

function start(next) {
  scenario = next
  step = 0
  state = initial()
  render()
}

function render() {
  const status = potStatus(state)
  const rows = Object.values(state.people).map((p) => {
    const yes = p.yes ? "Yes, $" + p.yes : "No reply"
    const paid = p.paid >= p.yes && p.yes > 0
    const paidText = p.paid ? "Paid $" + p.paid : "Not yet"
    return "<tr><td>" + p.name + "</td><td>" + yes + "</td><td class='" + (paid ? "paid" : "unpaid") + "'>" + paidText + "</td></tr>"
  }).join("")

  document.getElementById("screen").innerHTML =
    "<div class='plan'>Lisbon flat · $" + (AMOUNT * 2) + " between Maya and Sam. Jo has not been asked.</div>" +
    "<div class='status " + status.word.toLowerCase() + "'>" + status.word + "</div>" +
    "<p class='gap'>" + (status.word === "Covered" ? "Every yes has a matching payment." : status.word === "Open" ? "Waiting for someone to say yes." : "$" + status.gap + " still missing.") + "</p>" +
    "<table><thead><tr><th>Person</th><th>Said</th><th>Paid</th></tr></thead><tbody>" + rows + "</tbody></table>" +
    "<div class='agent'><b>Agent</b>I can remind people. I cannot mark this covered.</div>"

  document.getElementById("private").innerHTML =
    "<b>Maya's own agent, not shared</b><p style='margin:6px 0 0'>“I cannot really afford this.” This line is not on the group screen.</p>"

  document.getElementById("tabs").innerHTML = SCENARIOS.map((s) =>
    "<button class='tab" + (s.id === scenario.id ? " on" : "") + "' data-id='" + s.id + "'>" + s.label + "</button>"
  ).join("")

  document.getElementById("blurb").textContent = scenario.blurb

  document.getElementById("steps").innerHTML = scenario.steps.map((name, i) => {
    const label = FREE.find((pair) => pair[0] === name)[1]
    const cls = i === step ? "next" : ""
    return "<button class='" + cls + "' data-step='" + i + "' data-action='" + name + "'>" + (i + 1) + ". " + label + "</button>"
  }).join("")

  const event = document.getElementById("event")
  event.textContent = state.lastEvent
  event.className = "event" + (state.refused ? " bad" : "")

  document.getElementById("free").innerHTML = FREE.map(([name, label]) =>
    "<button data-action='" + name + "'>" + label + "</button>"
  ).join("")

  const yesBook = Object.values(state.people).filter((p) => p.yes).map((p) => p.name + " $" + p.yes).join(", ") || "empty"
  const payBook = Object.values(state.people).filter((p) => p.paid).map((p) => p.name + " $" + p.paid).join(", ") || "empty"
  document.getElementById("facts").innerHTML =
    "<div class='fact'><strong>Yeses, kept by memory.</strong> " + yesBook + "</div>" +
    "<div class='fact'><strong>Payments, read from the chain.</strong> " + payBook + "</div>" +
    "<div class='fact'><strong>Status.</strong> " + status.word + ". Computed from the two lists. The agent is not an input.</div>" +
    "<div class='fact'><strong>Private note on the group record.</strong> No.</div>"

  document.querySelectorAll("#tabs button").forEach((btn) => {
    btn.onclick = () => start(SCENARIOS.find((s) => s.id === btn.dataset.id))
  })
  document.querySelectorAll("#steps button").forEach((btn) => {
    btn.onclick = () => {
      const index = Number(btn.dataset.step)
      if (index !== step) return
      dispatch(btn.dataset.action)
      step = index + 1
      render()
    }
  })
  document.querySelectorAll("#free button").forEach((btn) => {
    btn.onclick = () => dispatch(btn.dataset.action)
  })
}

render()
</script>
</body>
</html>
