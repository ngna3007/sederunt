<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sederunt ribbon draft</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500&amp;family=Inter:wght@400;500&amp;display=swap">
  <style>
    :root { --hold: 0; --ease-out: cubic-bezier(0.23, 1, 0.32, 1); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #070a0e; color: #e7eef4; }
    body { font-family: Inter, "Helvetica Neue", Helvetica, sans-serif; overflow: hidden; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .copy {
      position: fixed;
      left: 28px;
      bottom: 88px;
      z-index: 2;
      max-width: min(34rem, calc(100vw - 56px));
      pointer-events: none;
    }
    .kicker {
      margin: 0 0 10px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #9ee7f2;
    }
    h1 {
      margin: 0;
      font-family: Outfit, Inter, sans-serif;
      font-weight: 300;
      font-size: clamp(2.6rem, 6vw, 4.6rem);
      letter-spacing: -0.04em;
      line-height: 0.95;
    }
    .line { margin: 14px 0 0; max-width: 28rem; font-size: 16px; line-height: 1.45; color: #c5d0da; }
    .hint {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 2;
      margin: 0;
      transform: translateX(-50%);
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #e7eef4;
      opacity: 0.8;
      transition: opacity 180ms var(--ease-out);
      pointer-events: none;
    }
    .hint.is-quiet { opacity: 0; }
    .meter {
      position: fixed;
      left: 28px;
      right: 28px;
      bottom: 18px;
      height: 2px;
      z-index: 2;
      pointer-events: none;
    }
    .meter span {
      display: block;
      height: 100%;
      background: #9ee7f2;
      transform: scaleX(var(--hold));
      transform-origin: left center;
    }
    @media (max-width: 700px) {
      .copy { left: 20px; bottom: 96px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hint { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div class="copy">
    <p class="kicker">Draft · steel and ice</p>
    <h1>Pull it tight.</h1>
    <p class="line">Hold draws the ribbon in. Release lets it fall open.</p>
  </div>
  <p class="hint" id="hint">Press and hold</p>
  <div class="meter" aria-hidden="true"><span></span></div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.183.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
    import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

    const HOLD_SECONDS = 1.5;
    const SAMPLES = 120;
    const PROFILE = [
      [-1, -1],
      [-1, 0.15],
      [-0.82, 1],
      [0.82, 1],
      [1, 0.15],
      [1, -1],
      [0.55, -1.35],
      [-0.55, -1.35]
    ];
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const canvas = document.getElementById("stage");
    const hint = document.getElementById("hint");
    const rest = [
      new THREE.Vector3(-3.5, -0.42, 0.2),
      new THREE.Vector3(-1.75, 0.72, -0.55),
      new THREE.Vector3(0, -0.08, 0.28),
      new THREE.Vector3(1.75, 0.88, -0.38),
      new THREE.Vector3(3.5, -0.28, 0.32)
    ];
    const held = [
      new THREE.Vector3(-1.45, -0.95, 0.05),
      new THREE.Vector3(-0.7, 1.15, 0.62),
      new THREE.Vector3(0.05, 0.12, -0.42),
      new THREE.Vector3(0.8, 1.28, 0.5),
      new THREE.Vector3(1.55, -0.78, 0.02)
    ];
    const scratch = rest.map((point) => point.clone());
    const curve = new THREE.CatmullRomCurve3(scratch, false, "catmullrom", 0.35);
    const up = new THREE.Vector3(0, 1, 0);
    const alt = new THREE.Vector3(1, 0, 0);
    const tangent = new THREE.Vector3();
    const binormal = new THREE.Vector3();
    const normal = new THREE.Vector3();
    const point = new THREE.Vector3();
    const twist = new THREE.Quaternion();

    const bodyPositions = new Float32Array(SAMPLES * PROFILE.length * 3);
    const edgePositions = new Float32Array(SAMPLES * 2 * 3);
    const edgeColors = new Float32Array(SAMPLES * 2 * 3);
    const bodyGeometry = new THREE.BufferGeometry();
    bodyGeometry.setAttribute("position", new THREE.BufferAttribute(bodyPositions, 3));
    const bodyIndex = [];
    for (let i = 0; i < SAMPLES - 1; i += 1) {
      for (let k = 0; k < PROFILE.length; k += 1) {
        const a = i * PROFILE.length + k;
        const b = i * PROFILE.length + ((k + 1) % PROFILE.length);
        const c = (i + 1) * PROFILE.length + k;
        const d = (i + 1) * PROFILE.length + ((k + 1) % PROFILE.length);
        bodyIndex.push(a, d, b, a, c, d);
      }
    }
    bodyGeometry.setIndex(bodyIndex);
    const edgeGeometry = new THREE.BufferGeometry();
    edgeGeometry.setAttribute("position", new THREE.BufferAttribute(edgePositions, 3));
    edgeGeometry.setAttribute("color", new THREE.BufferAttribute(edgeColors, 3));
    const edgeIndex = [];
    for (let i = 0; i < SAMPLES - 1; i += 1) {
      const a = i * 2;
      edgeIndex.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
    edgeGeometry.setIndex(edgeIndex);

    const renderer = new THREE.WebGLRenderer({
      canvas,
      antialias: true,
      alpha: false,
      powerPreference: "high-performance",
      preserveDrawingBuffer: true
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ReinhardToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.setClearColor("#070a0e", 1);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog("#070a0e", 9, 18);
    const pmrem = new THREE.PMREMGenerator(renderer);
    scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
    scene.environmentIntensity = 0.35;

    const backdrop = new THREE.Mesh(
      new THREE.PlaneGeometry(18, 10),
      new THREE.ShaderMaterial({
        depthWrite: false,
        uniforms: {
          uA: { value: new THREE.Color("#05070a") },
          uB: { value: new THREE.Color("#123044") }
        },
        vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
        fragmentShader: "varying vec2 vUv; uniform vec3 uA; uniform vec3 uB; void main(){ float g = smoothstep(0.15, 0.95, vUv.x * 0.35 + vUv.y); gl_FragColor = vec4(mix(uA, uB, g), 1.0); }"
      })
    );
    backdrop.position.set(0, 0.2, -2.4);
    scene.add(backdrop);

    const body = new THREE.Mesh(
      bodyGeometry,
      new THREE.MeshPhysicalMaterial({
        color: new THREE.Color("#d5dde6"),
        roughness: 0.38,
        metalness: 0.28,
        clearcoat: 0.45,
        clearcoatRoughness: 0.32,
        side: THREE.DoubleSide
      })
    );
    scene.add(body);
    const edge = new THREE.Mesh(
      edgeGeometry,
      new THREE.MeshBasicMaterial({
        vertexColors: true,
        transparent: true,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        toneMapped: false
      })
    );
    scene.add(edge);

    const dustPositions = new Float32Array(48 * 3);
    for (let i = 0; i < 48; i += 1) {
      dustPositions[i * 3] = (Math.sin(i * 12.9) * 0.5) * 8;
      dustPositions[i * 3 + 1] = ((Math.sin(i * 4.1) + 1) * 0.5 - 0.5) * 4;
      dustPositions[i * 3 + 2] = (Math.sin(i * 8.2) * 0.5) * 2;
    }
    const dustGeometry = new THREE.BufferGeometry();
    dustGeometry.setAttribute("position", new THREE.BufferAttribute(dustPositions, 3));
    scene.add(new THREE.Points(
      dustGeometry,
      new THREE.PointsMaterial({ color: "#c5d8e6", size: 0.018, transparent: true, opacity: 0.45, depthWrite: false })
    ));

    scene.add(new THREE.AmbientLight("#8aa0b8", 0.22));
    const key = new THREE.DirectionalLight("#f4f7fb", 3.1);
    key.position.set(-4.2, 5.4, 4.8);
    scene.add(key);
    const fill = new THREE.DirectionalLight("#6e8ea8", 0.7);
    fill.position.set(4.5, 0.4, 2.2);
    scene.add(fill);
    const rim = new THREE.DirectionalLight("#d7fbff", 2.4);
    rim.position.set(1.2, 2.2, -4.6);
    scene.add(rim);

    const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 40);
    camera.position.set(0.65, 0.72, 6.15);
    camera.lookAt(0, 0.12, 0);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.32, 0.55, 0.82));
    composer.addPass(new OutputPass());

    let hold = 0;
    let vel = 0;
    let pressing = false;
    let last = performance.now();
    let time = 0;

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      renderer.setSize(width, height, false);
      composer.setSize(width, height);
      camera.aspect = width / Math.max(1, height);
      camera.updateProjectionMatrix();
      if (reduce) render(0);
    }

    function shapeRibbon(amount, now) {
      const open = Math.max(0, Math.min(1, amount));
      const breathe = reduce ? 0 : Math.sin(now * 0.7) * 0.035 * (1 - open);
      for (let i = 0; i < rest.length; i += 1) {
        scratch[i].lerpVectors(rest[i], held[i], open);
        if (i === 1 || i === 3) scratch[i].y += breathe;
      }
      curve.updateArcLengths();
      for (let i = 0; i < SAMPLES; i += 1) {
        const t = i / (SAMPLES - 1);
        curve.getPoint(t, point);
        tangent.copy(curve.getTangent(t));
        if (tangent.lengthSq() < 1e-8) tangent.set(1, 0, 0);
        else tangent.normalize();
        binormal.crossVectors(tangent, up);
        if (binormal.lengthSq() < 1e-6) binormal.crossVectors(tangent, alt);
        binormal.normalize();
        normal.crossVectors(binormal, tangent).normalize();
        twist.setFromAxisAngle(tangent, open * 0.95 * Math.sin(t * Math.PI));
        binormal.applyQuaternion(twist);
        normal.applyQuaternion(twist);
        const pinch = 0.42 + 0.58 * Math.sin(Math.PI * t);
        const halfWidth = (0.2 + (1 - open) * 0.08) * pinch;
        const halfThick = 0.032;
        for (let k = 0; k < PROFILE.length; k += 1) {
          const offset = (i * PROFILE.length + k) * 3;
          const across = PROFILE[k][0] * halfWidth;
          const lift = PROFILE[k][1] * halfThick;
          bodyPositions[offset] = point.x + binormal.x * across + normal.x * lift;
          bodyPositions[offset + 1] = point.y + binormal.y * across + normal.y * lift;
          bodyPositions[offset + 2] = point.z + binormal.z * across + normal.z * lift;
        }
        const lip = i * 6;
        const inner = halfWidth * 0.78;
        const outer = halfWidth * 0.98;
        const raise = halfThick * 1.35;
        edgePositions[lip] = point.x + binormal.x * inner + normal.x * raise;
        edgePositions[lip + 1] = point.y + binormal.y * inner + normal.y * raise;
        edgePositions[lip + 2] = point.z + binormal.z * inner + normal.z * raise;
        edgePositions[lip + 3] = point.x + binormal.x * outer + normal.x * raise;
        edgePositions[lip + 4] = point.y + binormal.y * outer + normal.y * raise;
        edgePositions[lip + 5] = point.z + binormal.z * outer + normal.z * raise;
        const pulse = ((now * (0.12 + open * 0.22)) % 1 + 1) % 1;
        const wrapped = Math.min(Math.abs(t - pulse), 1 - Math.abs(t - pulse));
        const hot = Math.max(0, 1 - wrapped / 0.07);
        const glow = hot * hot;
        for (let side = 0; side < 2; side += 1) {
          const colorAt = (i * 2 + side) * 3;
          edgeColors[colorAt] = 0.62 * glow;
          edgeColors[colorAt + 1] = 0.94 * glow;
          edgeColors[colorAt + 2] = glow;
        }
      }
      bodyGeometry.attributes.position.needsUpdate = true;
      bodyGeometry.computeVertexNormals();
      edgeGeometry.attributes.position.needsUpdate = true;
      edgeGeometry.attributes.color.needsUpdate = true;
      edgeGeometry.computeBoundingSphere();
      bodyGeometry.computeBoundingSphere();
    }

    function render(now) {
      const shown = Math.max(0, Math.min(1, hold));
      shapeRibbon(shown, now);
      const yaw = reduce ? 0.18 : Math.sin(now * 0.28) * 0.16 * (1 - shown * 0.35) + shown * 0.12;
      body.rotation.y = yaw;
      edge.rotation.y = yaw;
      composer.render();
      document.documentElement.style.setProperty("--hold", String(shown));
      hint.classList.toggle("is-quiet", pressing || shown > 0.04);
    }

    function frame(now) {
      const dt = Math.min(0.032, (now - last) / 1000);
      last = now;
      time = now / 1000;
      if (pressing) {
        hold = Math.min(1, hold + dt / HOLD_SECONDS);
        vel = 1 / HOLD_SECONDS;
      } else {
        const acc = -70 * hold - 14 * vel;
        vel += acc * dt;
        hold += vel * dt;
        if (Math.abs(hold) < 0.001 && Math.abs(vel) < 0.01) {
          hold = 0;
          vel = 0;
        }
      }
      render(time);
      requestAnimationFrame(frame);
    }

    function press(event) {
      if (event.button !== 0) return;
      pressing = true;
      if (reduce) {
        hold = 1;
        render(0);
      }
    }

    function release() {
      if (!pressing) return;
      pressing = false;
      if (reduce) {
        hold = 0;
        render(0);
      }
    }

    window.addEventListener("pointerdown", press);
    window.addEventListener("pointerup", release);
    window.addEventListener("pointercancel", release);
    window.addEventListener("resize", resize);
    resize();
    shapeRibbon(0, 0);
    if (reduce) {
      hint.textContent = "Press to draw it in. Release to open.";
      render(0);
    } else {
      requestAnimationFrame(frame);
    }
  </script>
</body>
</html>
