<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sederunt</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; }
    html, body, #app { height: 100%; margin: 0; overflow-x: hidden; }
    button, input { font: inherit; }

    .app-shell {
      --bg: #f4f3ef;
      --bg-elev: #fbfaf7;
      --card: #fffcf8;
      --card-2: #f3f1ec;
      --border-line: #e2ddd4;
      --border-soft: #ebe6dd;
      --border-dashed: #d4cfc4;
      --muted-bg: #f3f1ec;
      --fg: #172b76;
      --fg-strong: #081428;
      --fg-muted: #5c6790;
      --fg-dim: #4c5678;
      --surface: #fffcf8;
      --surface-hover: #eef2fb;
      --input-bg: #fffcf8;
      --btn-bg: #fffcf8;
      --btn-bg-hover: #f3f1ec;
      --overlay: rgba(8, 20, 40, 0.035);
      --overlay-strong: rgba(8, 20, 40, 0.06);
      --scrollbar: #d9d3c8;
      --scrollbar-hover: #b7b1a6;
      --topnav-bg: rgba(244, 243, 239, 0.88);
      --sidebar-bg: rgba(255, 252, 248, 0.94);
      --primary: #2458f6;
      --primary-600: #2458f6;
      --primary-700: #1b46c7;
      --primary-tint: rgba(36, 88, 246, 0.10);
      --primary-tint-strong: rgba(36, 88, 246, 0.16);
      --primary-border: rgba(36, 88, 246, 0.32);
      --mark: #8ebcff;
      --green: #1c7c54;
      --red: #c24141;
      --amber: #a16207;
      --green-tint: rgba(28, 124, 84, 0.12);
      --red-tint: rgba(194, 65, 65, 0.12);
      --amber-tint: rgba(161, 98, 7, 0.12);
      --r-sm: 6px;
      --r-md: 8px;
      --r-lg: 12px;
      --r-xl: 14px;
      --font-sans: "Inter Tight", ui-sans-serif, system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
      --t-xs: 11px;
      --t-sm: 12.5px;
      --t-base: 13.5px;
      --t-md: 14px;
      --t-lg: 16px;
      --t-xl: 20px;
      --t-2xl: 26px;
      min-height: 100%;
      height: 100%;
      display: grid;
      grid-template-rows: 60px minmax(0, 1fr);
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      font-size: var(--t-base);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .app-shell * { box-sizing: border-box; }
    .app-shell ::-webkit-scrollbar { width: 10px; height: 10px; }
    .app-shell ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 999px; border: 2px solid var(--bg); }
    .app-shell ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }
    .app-shell button:focus-visible,
    .app-shell input:focus-visible,
    .app-shell tr[tabindex]:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    .app-shell .room-block:focus-visible { outline-offset: -2px; }

    .topnav {
      position: relative; z-index: 20;
      display: flex; align-items: center; gap: 18px;
      height: 60px; padding: 14px 28px;
      border-bottom: 1px solid var(--border-soft);
      background: var(--bg);
    }
    .brand {
      display: inline-flex; align-items: center; gap: 8px;
      font-weight: 600; font-size: 15px; letter-spacing: -0.015em;
      color: var(--fg-strong); text-decoration: none;
      border: 0; background: transparent; padding: 0; cursor: pointer;
      font-family: inherit;
    }
    .brand .mark { width: 26px; height: 26px; border-radius: 7px; display: block; }
    .org-wrap { position: relative; }
    .org-switcher {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 10px 6px 6px; border-radius: var(--r-md);
      border: 1px solid var(--border-line); background: var(--overlay);
      cursor: pointer; font-size: 13px; color: var(--fg);
    }
    .org-switcher:hover, .org-switcher.open { background: var(--overlay-strong); }
    .org-switcher .chev { transition: transform 120ms ease; }
    .org-switcher.open .chev { transform: rotate(180deg); }
    .org-menu {
      position: absolute; top: calc(100% + 8px); left: 0; z-index: 30;
      width: 280px; padding: 6px;
      background: var(--card); border: 1px solid var(--border-line);
      border-radius: var(--r-lg);
      box-shadow: 0 18px 50px -24px rgba(8, 20, 40, 0.35);
    }
    .org-menu .sb-link { color: var(--fg-muted); }
    .org-menu .sb-divider { margin: 6px 4px; }
    .org-switcher .av, .ws .av {
      width: 22px; height: 22px; border-radius: 5px;
      background: linear-gradient(135deg, var(--primary-700), var(--primary));
      display: grid; place-items: center; color: #fff;
      font-size: 10.5px; font-weight: 600; flex: none;
    }
    .org-switcher.pe .av, .ws.pe .av { background: #081428; }
    .org-switcher .chev { color: var(--fg-dim); }
    .user-av {
      margin-left: auto; width: 30px; height: 30px; border-radius: 50%;
      background: var(--fg-strong);
      display: grid; place-items: center; color: #fff;
      font-size: 11.5px; font-weight: 600;
      border: 1px solid var(--border-line);
    }

    .app-shell-body { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 0; }
    .ds-sidebar {
      border-right: 1px solid var(--border-soft);
      padding: 18px 12px;
      display: flex; flex-direction: column; gap: 4px;
      background: var(--card);
      overflow: auto;
    }
    .ds-section-label {
      font-size: 11px; color: var(--fg-dim);
      text-transform: uppercase; letter-spacing: 0.04em;
      padding: 10px 12px 4px; margin: 0;
    }
    .sb-link, .ws {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: var(--r-md);
      font-size: var(--t-base); color: var(--fg-muted);
      cursor: pointer; border: 1px solid transparent;
      background: transparent; text-align: left; width: 100%;
      transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
    }
    .sb-link:hover, .ws:hover { background: var(--surface-hover); color: var(--fg); }
    .sb-link.active, .ws.on {
      background: var(--primary-tint); color: var(--primary); border-color: var(--primary-border);
    }
    .sb-link .ic, .sb-link .label { display: inline-flex; }
    .sb-link .ic { width: 16px; height: 16px; flex: 0 0 16px; align-items: center; justify-content: center; }
    .sb-link .label { flex: 1; }
    .ws { display: grid; grid-template-columns: 22px minmax(0, 1fr) 14px 14px; align-items: center; }
    .ws .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ws .tick { color: transparent; }
    .ws.on .tick { color: var(--primary); }
    .ws .n { font-family: var(--font-mono); font-size: 11px; color: var(--fg-dim); text-align: right; }
    .sb-divider { height: 1px; background: var(--border-soft); margin: 8px 4px; }

    .main {
      min-width: 0; overflow: auto;
      background: var(--bg);
    }
    .page { max-width: 1200px; margin: 0 auto; padding: 32px 32px 80px; }
    .page-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 16px; margin-bottom: 22px;
    }
    .page-title {
      font-size: var(--t-2xl); font-weight: 600; letter-spacing: -0.01em;
      color: var(--fg-strong); margin: 0;
    }
    .page-subtitle { font-size: var(--t-md); color: var(--fg-muted); margin: 4px 0 0; }
    .sample-line { margin: 8px 0 0; font-size: 12.5px; color: var(--fg-muted); }

    .stat-row {
      display: grid; grid-template-columns: repeat(4, 1fr);
      border: 1px solid var(--border-soft); border-radius: var(--r-lg);
      background: var(--card); margin-bottom: 14px; overflow: hidden;
    }
    .stat-row > .stat {
      display: block; width: 100%; margin: 0; padding: 16px 18px;
      border: 0; border-right: 1px solid var(--border-soft);
      background: transparent; color: inherit; font: inherit; text-align: left;
    }
    .stat-row > .stat:last-child { border-right: 0; }
    button.stat { cursor: pointer; }
    .stat-row > .stat.attention { background: var(--amber-tint); }
    .stat-row > button.stat.attention:hover { background: rgba(161, 98, 7, 0.18); }
    .stat-row .lbl { font-size: 12px; color: var(--fg-dim); letter-spacing: 0.01em; }
    .stat-row .attention .val { color: #7c4704; }
    .stat-row .attention .sub { color: var(--fg-dim); }
    .stat-row .val {
      font-size: 22px; font-weight: 600; color: var(--fg-strong);
      margin-top: 4px; font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
    }
    .stat-row .sub { font-size: 11.5px; color: var(--fg-muted); margin-top: 2px; }

    .card {
      background: var(--card); border: 1px solid var(--border-soft);
      border-radius: var(--r-lg); overflow: hidden;
    }
    .card-header {
      padding: 16px 18px; border-bottom: 1px solid var(--border-soft);
      display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    }
    .card-title { font-size: 14.5px; font-weight: 600; color: var(--fg-strong); margin: 0; letter-spacing: -0.005em; }
    .card-desc { font-size: 12.5px; color: var(--fg-muted); margin: 3px 0 0; }
    .stack { display: flex; flex-direction: column; gap: 14px; }

    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; line-height: 1; padding: 4px 8px; border-radius: 999px;
      border: 1px solid var(--border-line); background: var(--surface);
      color: var(--fg-muted); font-weight: 500; white-space: nowrap;
    }
    .badge-indigo { background: var(--primary-tint); color: var(--primary); border-color: var(--primary-border); }
    .badge-green { background: var(--green-tint); color: #0f5c3c; border-color: rgba(28, 124, 84, 0.28); }
    .badge-red { background: var(--red-tint); color: #8f2d2d; border-color: rgba(194, 65, 65, 0.28); }
    .badge-amber { background: var(--amber-tint); color: #7c4704; border-color: rgba(161, 98, 7, 0.28); }
    .badge-outline { background: transparent; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      height: 32px; padding: 0 12px; font-size: var(--t-base); font-weight: 500;
      color: var(--fg); background: var(--btn-bg); border: 1px solid var(--border-line);
      border-radius: var(--r-md); cursor: pointer; white-space: nowrap;
      transition: background 120ms ease, border-color 120ms ease;
    }
    .btn:hover { background: var(--btn-bg-hover); }
    .btn-primary {
      background: var(--primary-600); border-color: var(--primary-600); color: #fff;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 6px 24px -8px rgba(36, 88, 246, 0.55);
    }
    .btn-primary:hover { background: var(--primary-700); border-color: var(--primary-700); }
    .btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }
    .btn-icon { width: 44px; height: 44px; padding: 0; }
    .btn-ghost { background: transparent; border-color: transparent; color: var(--fg-muted); }
    .btn-ghost:hover { background: var(--surface-hover); color: var(--fg); }

    .hist-bar {
      display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .hist-cuts {
      display: inline-flex; padding: 2px; gap: 2px;
      background: #e7e4de; border-radius: 8px;
    }
    .hist-cut, .hist-kind {
      height: 32px; padding: 0 12px; border: 0; background: transparent;
      color: var(--fg-muted); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
    }
    .hist-cut { border-radius: 6px; }
    .hist-cut.on { background: var(--card); color: var(--fg-strong); }
    .hist-kinds { display: flex; gap: 2px; flex-wrap: wrap; }
    .hist-kind { border-radius: 6px; }
    .hist-kind.on {
      color: var(--fg-strong); font-weight: 600; border-radius: 0;
      box-shadow: inset 0 -1.5px 0 var(--fg-strong);
    }
    .hist {
      background: var(--card); border: 1px solid var(--border-line); border-radius: 12px; overflow: hidden;
    }
    .hist-row {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      width: 100%; min-height: 64px; padding: 14px 18px;
      border: 0; border-top: 1px solid var(--border-soft);
      background: transparent; color: inherit; text-align: left; font: inherit; cursor: pointer;
    }
    .hist-row:first-child { border-top: 0; }
    .hist-row:hover { background: rgba(8, 20, 40, 0.03); }
    .hist-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .hist-title {
      color: var(--fg-strong); font-size: 15px; font-weight: 600; letter-spacing: -0.015em;
    }
    .hist-meta { color: var(--fg-muted); font-size: 13px; }
    .hist-end { display: inline-flex; align-items: center; gap: 8px; flex: none; }
    .hist-state { color: var(--fg-muted); font-size: 13px; }
    .hist-state.attention { color: #7c4704; font-weight: 600; }
    .hist-state.failed { color: #8f2d2d; font-weight: 600; }
    .hist-end .chev { color: var(--fg-dim); font-size: 16px; line-height: 1; }
    .hist-empty { margin: 8px 0 0; color: var(--fg-muted); }
    .hist-group { margin-top: 22px; }
    .hist-group:first-child { margin-top: 0; }
    .hist-group h3 {
      margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--fg-strong);
    }
    .hist-detail > p { margin: 0 0 8px; }
    .hist-detail > .hist-meta { margin-bottom: 10px; }
    .hist-detail .file-tiles { margin: 4px 0 10px; }
    .hist-detail .acts { margin-top: 14px; }

    .tbl { width: 100%; border-collapse: collapse; font-size: var(--t-base); }
    .tbl thead th {
      text-align: left; font-weight: 500; font-size: 11.5px;
      letter-spacing: 0.02em; color: var(--fg-dim);
      padding: 12px 16px; border-bottom: 1px solid var(--border-soft); background: var(--overlay);
    }
    .tbl tbody td {
      padding: 14px 16px; border-bottom: 1px solid var(--border-soft);
      color: var(--fg); vertical-align: middle;
    }
    .tbl tbody tr:last-child td { border-bottom: 0; }
    .tbl tbody td:first-child { color: var(--fg-strong); font-weight: 500; }
    .tbl tbody td.quiet { color: var(--fg-muted); font-weight: 400; }
    .tbl tbody tr[data-act] { cursor: pointer; }
    .tbl tbody tr[data-act]:hover td { background: var(--surface-hover); }
    .tbl tbody tr.sel td { background: var(--primary-tint); }
    .tbl tbody tr.sel td:first-child { box-shadow: inset 2px 0 0 var(--primary); }
    .tbl tbody tr.sel:hover td { background: var(--primary-tint); }
    .quiet { color: var(--fg-muted); font-weight: 400; }

    .room-section { margin-top: 22px; }
    .section-head {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 12px; margin-bottom: 14px;
    }
    .section-title {
      margin: 0; font-size: 16px; font-weight: 600; color: var(--fg-strong); letter-spacing: -0.015em;
    }
    .section-note { margin: 3px 0 0; font-size: 13px; color: var(--fg-muted); }
    .room-board {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px;
    }
    .room-block {
      display: flex; flex-direction: column; align-items: stretch;
      width: 100%; padding: 0;
      text-align: left; white-space: normal; color: inherit; font: inherit; cursor: pointer;
      background: var(--card); border: 1px solid var(--border-line); border-radius: var(--r-lg);
      transition: border-color 120ms ease;
    }
    .room-block:hover { border-color: var(--fg-dim); }
    .room-block.sel { box-shadow: inset 0 0 0 2px var(--primary); }
    .room-head { display: flex; align-items: center; gap: 12px; padding: 16px; }
    .room-id { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .room-mark { width: 40px; height: 40px; flex: none; display: grid; place-items: center; }
    .room-mark svg { width: 36px; height: 36px; display: block; }
    .room-name { font-size: 16px; font-weight: 600; color: var(--fg-strong); letter-spacing: -0.015em; }
    .room-where { color: var(--fg-dim); font-size: 13px; }
    .room-foot {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-top: auto; padding: 10px 16px;
      border-top: 1px solid var(--border-soft);
    }
    .room-people { display: inline-flex; align-items: center; min-width: 0; }
    .room-people.quiet { color: var(--fg-dim); font-size: 13px; }
    .mem {
      width: 22px; height: 22px; margin-left: -6px; border-radius: 50%;
      display: grid; place-items: center; flex: none;
      background: var(--bg); color: var(--fg); border: 2px solid var(--card);
      font-size: 10px; font-weight: 600;
    }
    .mem:first-child { margin-left: 0; }
    .mem.t0 { background: #4338ca; color: #fff; }
    .mem.t1 { background: #0e7490; color: #fff; }
    .mem.t2 { background: #0f6b3a; color: #fff; }
    .mem.t3 { background: #b45309; color: #fff; }
    .mem.t4 { background: #b91c1c; color: #fff; }
    .mem.t5 { background: #7048e8; color: #fff; }
    .mem.t6 { background: #1864ab; color: #fff; }
    .mem.t7 { background: #be185d; color: #fff; }
    .mem.more { background: var(--bg); color: var(--fg-dim); }
    .room-bot {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--fg); font-size: 13px; font-weight: 500; flex: none;
    }
    .room-bot .bot-av { width: 22px; height: 22px; border-radius: 50%; display: block; flex: none; }
    .room-empty { margin: 0; color: var(--fg-dim); }

    .account-row {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 18px; border-top: 1px solid var(--border-soft);
    }
    .account-row:first-child { border-top: 0; }
    .account-row .grow { flex: 1; min-width: 0; }
    .account-row strong { color: var(--fg-strong); font-weight: 600; font-size: 13.5px; }
    .account-row p { margin: 2px 0 0; color: var(--fg-muted); font-size: 12.5px; }
    .av-sm {
      width: 28px; height: 28px; border-radius: 50%; flex: none;
      background: var(--primary-tint); color: var(--primary);
      display: grid; place-items: center; font-size: 11px; font-weight: 600;
    }
    .seg { display: inline-flex; border: 1px solid var(--border-line); border-radius: var(--r-md); overflow: hidden; }
    .seg .btn { border: 0; border-radius: 0; box-shadow: none; }
    .seg .btn + .btn { border-left: 1px solid var(--border-line); }
    .seg .btn.on { background: var(--primary); color: #fff; }

    .plain { list-style: none; margin: 0; padding: 0; }
    .plain li { padding: 14px 18px; border-top: 1px solid var(--border-soft); color: var(--fg); }
    .plain li:first-child { border-top: 0; }
    .mono { font-family: var(--font-mono); font-size: 12px; }
    .proofs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }

    .thread .msg { padding: 14px 18px; border-top: 1px solid var(--border-soft); }
    .thread .msg:first-child { border-top: 0; }
    .thread .who { font-size: 12px; font-weight: 600; color: var(--fg-strong); }
    .thread .msg p { margin: 4px 0 0; color: var(--fg); }
    .composer { display: flex; gap: 8px; margin-top: 12px; }
    .input {
      height: 32px; background: var(--input-bg); border: 1px solid var(--border-line);
      color: var(--fg); border-radius: var(--r-md); padding: 0 10px;
      font-size: var(--t-base); width: 100%;
    }
    .input::placeholder { color: var(--fg-dim); }
    .input:focus { border-color: var(--primary); }

    .k, .kicker {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
      text-transform: uppercase; color: var(--primary); margin: 0;
    }
    .acts { display: flex; gap: 8px; margin-top: 16px; }
    .hint { font-size: 12.5px; }

    .shade {
      position: fixed; inset: 0; z-index: 40;
      background: rgba(8, 20, 40, 0.42);
      display: grid; place-items: center; padding: 20px;
    }
    .modal {
      width: min(460px, 100%);
      max-height: min(80vh, 720px);
      overflow: auto;
      background: var(--card); border: 1px solid var(--border-line);
      border-radius: var(--r-lg);
      box-shadow: 0 24px 60px -28px rgba(8, 20, 40, 0.45);
    }
    .modal.detail { width: min(640px, 100%); }
    .page-actions { display: flex; gap: 8px; flex: none; }
    .choice { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .choice-btn {
      text-align: left; min-height: 44px; padding: 10px 12px;
      border-radius: var(--r-md); border: 1px solid var(--border-line);
      background: var(--card); color: var(--fg); cursor: pointer; font: inherit;
    }
    .choice-btn strong { display: block; color: var(--fg-strong); font-weight: 600; }
    .choice-btn span { display: block; margin-top: 4px; color: var(--fg-muted); font-size: 12.5px; font-weight: 400; }
    .choice-btn.on { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
    .field { display: block; margin: 0 0 6px; font-size: 13px; color: var(--fg-strong); font-weight: 600; }
    .form-error { color: var(--red); margin: 8px 0 0; }
    .room-file .stand {
      margin: 0; font-size: 18px; line-height: 1.35; font-weight: 600;
      letter-spacing: -0.02em; color: var(--fg-strong);
    }
