<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sederunt marks and parts</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@8..144,400..500&amp;family=Google+Sans+Code:wght@400&amp;display=swap">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html { overflow-x: clip; }
    body {
      margin: 0;
      background: #000000;
      color: #faf8f5;
      font-family: "Google Sans Flex", "Helvetica Neue", Helvetica, sans-serif;
      font-size: 19px;
      line-height: 25px;
      font-weight: 400;
    }
    .sheet {
      max-width: 1120px;
      margin: 0 auto;
      padding: 48px 20px 80px;
    }
    h1 {
      margin: 0;
      font-size: 2.75rem;
      line-height: 0.95;
      font-weight: 425;
      letter-spacing: -0.5px;
    }
    h2 {
      margin: 56px 0 8px;
      font-size: 19px;
      line-height: 25px;
      font-weight: 400;
    }
    .lede, .caption {
      margin: 8px 0 0;
      color: #b1b4b6;
      font-family: "Google Sans Code", ui-monospace, monospace;
      font-size: 13px;
      line-height: 18px;
      letter-spacing: 0.04em;
    }
    .marks, .parts, .screens {
      display: grid;
      gap: 20px;
      margin-top: 28px;
    }
    @media (min-width: 800px) {
      h1 { font-size: 4.5rem; }
      .marks { grid-template-columns: 1.3fr 1fr 1fr; }
      .parts { grid-template-columns: 1fr 1fr; }
      .screens { grid-template-columns: 1fr 1fr; }
    }
    figure {
      margin: 0;
      min-width: 0;
    }
    figcaption {
      margin-top: 10px;
      color: #b1b4b6;
      font-family: "Google Sans Code", ui-monospace, monospace;
      font-size: 13px;
      line-height: 18px;
      letter-spacing: 0.02em;
    }
    .use { color: #faf8f5; }
    .specimen {
      background: #000000;
      border: 1px solid rgba(250, 248, 245, 0.22);
      border-radius: 24px;
      padding: 24px 20px;
      min-height: 148px;
    }
    .word {
      margin: 0;
      font-size: 2.75rem;
      line-height: 0.95;
      font-weight: 425;
      letter-spacing: -0.5px;
    }
    .mark {
      display: block;
      width: 64px;
      height: 64px;
    }
    .frame {
      display: block;
      width: 100%;
      max-width: 180px;
      height: auto;
    }
    .lockup {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .lockup .word { font-size: 2rem; }
    p { margin: 0; text-wrap: pretty; }
    .rule { margin-top: 12px; }
    #allow, .allow { margin-top: 16px; }
    dl { margin: 12px 0 0; }
    dl div {
      display: grid;
      grid-template-columns: 6.5rem minmax(0, 1fr);
      column-gap: 12px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(250, 248, 245, 0.16);
    }
    dl div:first-child { border-top: 1px solid rgba(250, 248, 245, 0.16); }
    dt, dd { margin: 0; font-weight: 400; }
    dt { color: #b1b4b6; }
    .issue-line {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      align-items: baseline;
      margin-top: 8px;
    }
    .issue-line strong {
      min-width: 5rem;
      font-family: "Google Sans Code", ui-monospace, monospace;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.04em;
    }
    button, .pill {
      appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      min-width: 44px;
      margin: 16px 12px 0 0;
      padding: 12px 32px;
      border: 1px solid #53575a;
      border-radius: 26px;
      background: transparent;
      color: #b1b4b6;
      font-family: "Google Sans Code", ui-monospace, monospace;
      font-size: 16px;
      font-weight: 400;
      line-height: 20px;
      letter-spacing: 0.04em;
    }
    .filled { border-color: #faf8f5; color: #faf8f5; }
    label { display: block; margin-top: 16px; }
    textarea {
      display: block;
      width: 100%;
      min-height: 6.5rem;
      margin-top: 8px;
      padding: 12px 14px;
      border: 1px solid #53575a;
      border-radius: 8px;
      background: #14181b;
      color: #faf8f5;
      font: inherit;
      resize: vertical;
    }
    .yes { margin-top: 12px; }
    .minute + .minute {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(250, 248, 245, 0.16);
    }
    .empty { color: #faf8f5; }
    button:focus-visible, textarea:focus-visible {
      outline: 2px solid #faf8f5;
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <main class="sheet">
    <h1>Marks and parts</h1>
    <p class="lede">One wordmark. One small mark. The same parts on every screen.</p>

    <h2>Logo</h2>
    <div class="marks">
      <figure>
        <div class="specimen">
          <p class="word">Sederunt</p>
        </div>
        <figcaption class="use">Use on the page. The name is the logo.</figcaption>
      </figure>
      <figure>
        <div class="specimen">
          <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M4 12h24" fill="none" stroke="#faf8f5" stroke-width="1.5"/>
            <path d="M4 20h14" fill="none" stroke="#faf8f5" stroke-width="1.5"/>
            <circle cx="23" cy="20" r="2.25" fill="#faf8f5"/>
          </svg>
        </div>
        <figcaption class="use">Use at 16px and 32px. A line, and the stop that closed it.</figcaption>
      </figure>
      <figure>
        <div class="specimen">
          <div class="lockup">
            <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
              <path d="M4 12h24" fill="none" stroke="#faf8f5" stroke-width="1.5"/>
              <path d="M4 20h14" fill="none" stroke="#faf8f5" stroke-width="1.5"/>
              <circle cx="23" cy="20" r="2.25" fill="#faf8f5"/>
            </svg>
            <p class="word">Sederunt</p>
          </div>
        </div>
        <figcaption>Leave. The mark beside the name crowds the display.</figcaption>
      </figure>
    </div>

    <h2>Path</h2>
    <p class="lede">Shown only while the record is empty. Three states of the same mark.</p>
    <div class="parts">
      <figure>
        <div class="specimen">
          <svg class="frame" viewBox="0 0 120 72" aria-hidden="true">
            <rect x="0.5" y="0.5" width="119" height="71" rx="10" fill="#14181b" stroke="rgba(250,248,245,0.35)"/>
            <path d="M16 26h88M16 44h60" fill="none" stroke="#faf8f5" stroke-width="1.5"/>
          </svg>
          <p class="rule">Recorded. A line is kept.</p>
        </div>
        <figcaption class="use">First state. No stop, because nothing has been filed.</figcaption>
      </figure>
      <figure>
        <div class="specimen">
          <svg class="frame" viewBox="0 0 120 72" aria-hidden="true">
            <rect x="0.5" y="0.5" width="119" height="71" rx="10" fill="#14181b" stroke="rgba(250,248,245,0.35)"/>
            <path d="M16 26h88M16 44h48" fill="none" stroke="#faf8f5" stroke-width="1.5"/>
            <rect x="70" y="36" width="34" height="16" rx="8" fill="none" stroke="#faf8f5" stroke-width="1.25"/>
          </svg>
          <p class="rule">Yes. That write only.</p>
        </div>
        <figcaption class="use">The pill is the yes. It covers one write.</figcaption>
      </figure>
      <figure>
        <div class="specimen">
          <svg class="frame" viewBox="0 0 120 72" aria-hidden="true">
            <rect x="0.5" y="0.5" width="119" height="71" rx="10" fill="#14181b" stroke="rgba(250,248,245,0.35)"/>
            <path d="M16 26h88M16 44h48" fill="none" stroke="#faf8f5" stroke-width="1.5"/>
            <circle cx="76" cy="44" r="3.5" fill="#faf8f5"/>
          </svg>
          <p class="rule">Filed. An id came back.</p>
        </div>
        <figcaption class="use">The stop is the id. This is also the small logo.</figcaption>
      </figure>
    </div>

    <h2>Parts</h2>
    <div class="parts">
      <figure>
        <div class="specimen">
          <p>A ticket is filed only after yes, and only when Linear returns an id.</p>
          <p class="allow">Allow is off.</p>
        </div>
        <figcaption>Rule and allow. The allow is a sentence, not a switch.</figcaption>
      </figure>
      <figure>
        <div class="specimen">
          <p>Da Nang offsite in March</p>
          <dl>
            <div><dt>Status</dt><dd>recorded</dd></div>
            <div><dt>Linear</dt><dd><strong>ROW-44</strong></dd></div>
          </dl>
        </div>
        <figcaption>Minute and fact row. The id is the only strong text.</figcaption>
      </figure>
      <figure>
        <div class="specimen">
          <p class="issue-line"><strong>ROW-8</strong><span>Typed Linear read</span><span>Done</span></p>
          <p class="yes">This read created nothing.</p>
        </div>
        <figcaption>Issue line, then the sentence that the read wrote nothing.</figcaption>
      </figure>
      <figure>
        <div class="specimen">
          <p class="empty">No notes yet.</p>
          <label for="text">Note, question, or ticket</label>
          <textarea id="text" name="text"></textarea>
          <button class="filled" type="button">Record</button>
          <button type="button">File venue ticket</button>
        </div>
        <figcaption>Empty, field, primary pill, quiet pill. Same shape.</figcaption>
      </figure>
      <figure>
        <div class="specimen">
          <p>File the venue ticket hall</p>
          <dl>
            <div><dt>Status</dt><dd>recorded</dd></div>
          </dl>
          <p class="yes">Yes files this write only.</p>
          <button class="filled" type="button">File venue ticket</button>
        </div>
        <figcaption>Pending write. No Linear row until an id comes back.</figcaption>
      </figure>
      <figure>
        <div class="specimen">
          <div class="minute">
            <p>Hold the offsite in Da Nang</p>
            <dl><div><dt>Status</dt><dd>clashing</dd></div></dl>
            <button class="filled" type="button">Keep this one</button>
          </div>
          <div class="minute">
            <p>Hold the offsite in Hoi An</p>
            <dl><div><dt>Status</dt><dd>clashing</dd></div></dl>
            <button type="button">Keep this one</button>
          </div>
        </div>
        <figcaption>Clash. Both stay. Newest does not win.</figcaption>
      </figure>
      <figure>
        <div class="specimen">
          <dl>
            <div><dt>Linear</dt><dd>Allow is off.</dd></div>
            <div><dt>Calendar</dt><dd>Not yet.</dd></div>
          </dl>
        </div>
        <figcaption>Connectors. The value is the allow, or Not yet.</figcaption>
      </figure>
      <figure>
        <div class="specimen">
          <p>Sederunt can hear. An edit waits for an allow.</p>
          <p class="allow">Allow is off.</p>
        </div>
        <figcaption>Voice. One rule. No second control.</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
